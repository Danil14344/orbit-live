<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>EyeCrypt — 3D eye (pixel dissolve)</title>
<style>
  html,body{margin:0;height:100%;background:#07060d;color:#cfd3da;font:14px/1.4 Inter,system-ui,sans-serif;overflow:hidden}
  body{
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -20%, rgba(139, 92, 246, 0.18), transparent),
      radial-gradient(ellipse 60% 45% at 85% 108%, rgba(217, 70, 239, 0.12), transparent);
    background-attachment: fixed;
  }
  #ui{position:fixed;top:12px;left:12px;z-index:10;display:flex;gap:8px;flex-wrap:wrap}
  button{background:linear-gradient(90deg,#7c3aed,#d946ef);color:#fff;border:0;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;box-shadow:0 8px 24px -10px rgba(217,70,239,0.7)}
  button:hover{transform:translateY(-1px)}
  #hint{position:fixed;bottom:12px;left:12px;opacity:.55}
  #err{position:fixed;right:12px;top:12px;max-width:46ch;color:#ff8a8a;background:#1a0d0d;border:1px solid #5a2222;padding:8px;border-radius:6px;white-space:pre-wrap;font:12px/1.35 ui-monospace,monospace;display:none;z-index:20}
  canvas{display:block}
</style>
</head>
<body>
<div id="ui">
  <button id="btnDissolve">Распад</button>
  <button id="btnAssemble">Собрать</button>
  <button id="btnToggle">Авто</button>
</div>
<div id="hint">Курсор — слежение. Клик / кнопки — распад&nbsp;⇌&nbsp;сборка.</div>
<pre id="err"></pre>

<script>
  function showErr(m){const el=document.getElementById('err');el.style.display='block';el.textContent+=m+'\n';console.error(m);}
  addEventListener('error',e=>showErr('JS: '+(e.message||e.error)));
  addEventListener('unhandledrejection',e=>showErr('Promise: '+(e.reason&&e.reason.message||e.reason)));
</script>

<script src="three.min.js"></script>
<script>
  if (typeof THREE === 'undefined') document.write('<script src="https://unpkg.com/three@0.149.0/build/three.min.js"><\/script>');
</script>

<script>
(function(){
  if (typeof THREE === 'undefined') { showErr('three.js не загрузился (нет интернета и нет локального three.min.js).'); return; }

  // === Палитра EyeCrypt ===
  const COL = {
    bg:        '#07060d',
    sclera0:   '#191333',  // центр белка
    sclera1:   '#08070f',  // края белка
    irisInner: '#fce7ff',  // блик
    iris1:     '#f0abfc',
    iris2:     '#a855f7',
    iris3:     '#6d28d9',
    iris4:     '#2e1065',
    pupil:     '#06030e',
    rim1:      '#c4b5fd',
    rim2:      '#f0abfc',
    rim3:      '#8b5cf6',
    aura:      '#d946ef',
    glint:     '#ffffff'
  };

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  document.body.appendChild(renderer.domElement);

  // Ортогональная камера — для чёткого «миндалевидного» силуэта
  const ASPECT = () => innerWidth/innerHeight;
  const VIEW_W = 5.0;
  function makeCam(){
    const h = VIEW_W / ASPECT();
    const c = new THREE.OrthographicCamera(-VIEW_W/2, VIEW_W/2, h/2, -h/2, -10, 10);
    c.position.z = 5;
    return c;
  }
  let camera = makeCam();
  const scene = new THREE.Scene();

  // === Геометрия глаза в "виртуальных" единицах ===
  // viewBox сайта: 480x300, миндаль от x=70 до 410, y=56 до 244 → ширина 340, высота 188
  // в world units: width = 3.4, height = 1.88 (масштаб 0.01)
  const EYE_W = 3.4, EYE_H = 1.88;
  const IRIS_R = 0.84, PUPIL_R = 0.34;

  // Группа всей сцены глаза — её крутим за курсором
  const eyeGroup = new THREE.Group();
  scene.add(eyeGroup);

  // --- АУРА (фон, фуксиевое свечение) ---
  const aura = new THREE.Mesh(
    new THREE.PlaneGeometry(EYE_W*2.4, EYE_H*3.0),
    new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      uniforms: { uColor: { value: new THREE.Color(COL.aura) }, uTime: { value: 0 } },
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
      fragmentShader: `
        precision mediump float; varying vec2 vUv; uniform vec3 uColor; uniform float uTime;
        void main(){
          vec2 p = vUv - 0.5;
          float d = length(p*vec2(1.0,1.5));
          float a = smoothstep(0.55, 0.0, d) * (0.45 + 0.15*sin(uTime*1.2));
          gl_FragColor = vec4(uColor, a);
        }`
    })
  );
  aura.position.z = -0.5;
  eyeGroup.add(aura);

  // --- БЕЛОК + МИНДАЛЕВИДНАЯ МАСКА (плоскость с шейдером) ---
  // Кривая Безье из page.tsx: M70 150 C 150 56, 330 56, 410 150 C 330 244, 150 244, 70 150
  // В нормализ. координатах x:[-1..1], y:[-h/w..h/w] миндаль описывается:
  //   y_top(x) = -EYE_H/2 * (1 - x^2)^0.7   (две дуги, приближение)
  // Проще — использовать выражение |y| <= (EYE_H/2) * (1 - x^2)^0.85 для маски.
  function makeSclera(){
    const geo = new THREE.PlaneGeometry(EYE_W, EYE_H, 1, 1);
    const mat = new THREE.ShaderMaterial({
      transparent: true,
      uniforms: {
        uC0: { value: new THREE.Color(COL.sclera0) },
        uC1: { value: new THREE.Color(COL.sclera1) }
      },
      vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
      fragmentShader: `
        precision mediump float; varying vec2 vUv; uniform vec3 uC0; uniform vec3 uC1;
        void main(){
          // x:[-1..1], y:[-1..1] относительно плоскости
          vec2 p = vUv*2.0 - 1.0;
          // миндалевидная маска
          float lim = pow(max(0.0, 1.0 - p.x*p.x), 0.85);
          float aMask = smoothstep(lim+0.02, lim-0.02, abs(p.y));
          if (aMask <= 0.001) discard;
          // радиальный градиент белка (со смещением вверх как ec-white)
          vec2 g = vUv - vec2(0.5, 0.62);
          float d = length(g);
          vec3 col = mix(uC0, uC1, smoothstep(0.0, 0.75, d));
          gl_FragColor = vec4(col, aMask);
        }`
    });
    return new THREE.Mesh(geo, mat);
  }
  const sclera = makeSclera();
  sclera.position.z = 0;
  eyeGroup.add(sclera);

  // --- РАДУЖКА (canvas-текстура) ---
  function makeIrisTexture(){
    const s = 512;
    const cv = document.createElement('canvas'); cv.width = cv.height = s;
    const ctx = cv.getContext('2d');
    // ec-iris: cx=42%, cy=36%, r=78%
    const g = ctx.createRadialGradient(s*0.42, s*0.36, s*0.05, s*0.5, s*0.5, s*0.78);
    g.addColorStop(0.00, COL.irisInner);
    g.addColorStop(0.20, COL.iris1);
    g.addColorStop(0.48, COL.iris2);
    g.addColorStop(0.78, COL.iris3);
    g.addColorStop(1.00, COL.iris4);
    ctx.fillStyle = g; ctx.fillRect(0,0,s,s);

    // волокна
    ctx.globalAlpha = 0.35; ctx.strokeStyle = COL.iris4;
    for (let i=0;i<260;i++){
      const a = Math.random()*Math.PI*2;
      const r1 = s*0.10 + Math.random()*s*0.06;
      const r2 = s*0.46 + Math.random()*s*0.04;
      ctx.beginPath();
      ctx.moveTo(s/2 + Math.cos(a)*r1, s/2 + Math.sin(a)*r1);
      ctx.lineTo(s/2 + Math.cos(a)*r2, s/2 + Math.sin(a)*r2);
      ctx.lineWidth = 0.4 + Math.random()*1.0;
      ctx.stroke();
    }
    // тонкие кольца
    ctx.globalAlpha = 0.22; ctx.strokeStyle = COL.irisInner;
    [0.55, 0.40].forEach(r => { ctx.beginPath(); ctx.arc(s/2, s/2, s*r/2, 0, Math.PI*2); ctx.stroke(); });

    // лимбал (внешнее кольцо)
    ctx.globalAlpha = 1.0;
    const rim = ctx.createLinearGradient(0,0,s,s);
    rim.addColorStop(0, COL.rim1); rim.addColorStop(0.5, COL.rim2); rim.addColorStop(1, COL.rim3);
    ctx.strokeStyle = rim; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.arc(s/2, s/2, s*0.49, 0, Math.PI*2); ctx.stroke();

    const tex = new THREE.CanvasTexture(cv);
    tex.anisotropy = 4;
    return tex;
  }

  const iris = new THREE.Mesh(
    new THREE.CircleGeometry(IRIS_R, 128),
    new THREE.MeshBasicMaterial({ map: makeIrisTexture(), transparent: true })
  );
  iris.position.z = 0.02;
  eyeGroup.add(iris);

  // --- ЗРАЧОК + фуксиевое кольцо ---
  const pupil = new THREE.Mesh(
    new THREE.CircleGeometry(PUPIL_R, 64),
    new THREE.MeshBasicMaterial({ color: COL.pupil })
  );
  pupil.position.z = 0.03;
  eyeGroup.add(pupil);

  // тонкое кольцо фуксии вокруг зрачка
  const pupilRingGeo = new THREE.RingGeometry(PUPIL_R*0.98, PUPIL_R*1.06, 64);
  const pupilRing = new THREE.Mesh(pupilRingGeo, new THREE.MeshBasicMaterial({ color: COL.aura, transparent: true, opacity: 0.7 }));
  pupilRing.position.z = 0.031;
  eyeGroup.add(pupilRing);

  // --- БЛИКИ ---
  function glint(x,y,r,a){
    const m = new THREE.Mesh(new THREE.CircleGeometry(r, 32),
      new THREE.MeshBasicMaterial({ color: COL.glint, transparent: true, opacity: a }));
    m.position.set(x, y, 0.04);
    return m;
  }
  const glint1 = glint(-0.155, 0.165, 0.085, 0.92);
  const glint2 = glint( 0.150, -0.140, 0.040, 0.5);
  eyeGroup.add(glint1, glint2);

  // --- ОКАЁМКА МИНДАЛЯ (rim) ---
  function makeAlmondOutline(){
    const pts = [];
    const N = 200;
    for (let i=0;i<=N;i++){
      const t = i/N * Math.PI*2;
      const x = Math.cos(t);
      const y = Math.sin(t) * Math.pow(Math.max(0, 1-x*x), 0.85);
      pts.push(new THREE.Vector3(x*EYE_W/2, y*EYE_H/2, 0.05));
    }
    const geo = new THREE.BufferGeometry().setFromPoints(pts);
    return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: COL.rim2, transparent: true, opacity: 0.85 }));
  }
  const rim = makeAlmondOutline();
  eyeGroup.add(rim);

  const eyeMeshes = [sclera, iris, pupil, pupilRing, glint1, glint2];

  // === Сэмплинг точек по поверхностям мешей в облако ===
  function sampleMesh(mesh, count, outPos, outCol){
    const geom = mesh.geometry;
    const posAttr = geom.attributes.position;
    const indexAttr = geom.index;
    const triCount = indexAttr ? indexAttr.count/3 : posAttr.count/3;
    const areas = new Float32Array(triCount);
    let total = 0;
    const a = new THREE.Vector3(), b = new THREE.Vector3(), c = new THREE.Vector3();
    const ab = new THREE.Vector3(), ac = new THREE.Vector3(), cross = new THREE.Vector3();
    function getTri(i){
      if (indexAttr){
        const ia=indexAttr.getX(i*3), ib=indexAttr.getX(i*3+1), ic=indexAttr.getX(i*3+2);
        a.fromBufferAttribute(posAttr,ia); b.fromBufferAttribute(posAttr,ib); c.fromBufferAttribute(posAttr,ic);
      } else {
        a.fromBufferAttribute(posAttr,i*3); b.fromBufferAttribute(posAttr,i*3+1); c.fromBufferAttribute(posAttr,i*3+2);
      }
    }
    for (let i=0;i<triCount;i++){
      getTri(i);
      ab.subVectors(b,a); ac.subVectors(c,a); cross.crossVectors(ab,ac);
      areas[i] = cross.length()*0.5; total += areas[i];
    }
    const cdf = new Float32Array(triCount);
    let acc=0; for (let i=0;i<triCount;i++){ acc+=areas[i]; cdf[i]=acc/total; }

    const baseCol = new THREE.Color(mesh.material.color || 0xffffff);
    let mapCtx=null, mapW=0, mapH=0;
    if (mesh.material.map && mesh.material.map.image){
      const img = mesh.material.map.image;
      mapW = img.width; mapH = img.height;
      const cv = document.createElement('canvas'); cv.width=mapW; cv.height=mapH;
      mapCtx = cv.getContext('2d'); mapCtx.drawImage(img, 0, 0);
    }
    const uvAttr = geom.attributes.uv;
    const tmp = new THREE.Vector3();

    for (let i=0;i<count;i++){
      const r = Math.random();
      let lo=0, hi=triCount-1;
      while (lo<hi){ const m=(lo+hi)>>1; if (cdf[m]<r) lo=m+1; else hi=m; }
      const ti = lo; getTri(ti);
      let u=Math.random(), v=Math.random(); if (u+v>1){ u=1-u; v=1-v; } const w=1-u-v;
      tmp.set(a.x*w+b.x*u+c.x*v, a.y*w+b.y*u+c.y*v, a.z*w+b.z*u+c.z*v);
      tmp.applyMatrix4(mesh.matrixWorld);
      const local = eyeGroup.worldToLocal(tmp.clone());
      // Для плоской склеры применим миндалевидную маску к точкам
      if (mesh === sclera){
        const nx = local.x/(EYE_W/2), ny = local.y/(EYE_H/2);
        const lim = Math.pow(Math.max(0, 1-nx*nx), 0.85);
        if (Math.abs(ny) > lim) { i--; continue; }
      }
      outPos.push(local.x, local.y, local.z);
      if (mapCtx && uvAttr){
        let ua,ub_,uc;
        if (indexAttr){
          const ia=indexAttr.getX(ti*3), ib=indexAttr.getX(ti*3+1), ic=indexAttr.getX(ti*3+2);
          ua=[uvAttr.getX(ia),uvAttr.getY(ia)]; ub_=[uvAttr.getX(ib),uvAttr.getY(ib)]; uc=[uvAttr.getX(ic),uvAttr.getY(ic)];
        } else {
          ua=[uvAttr.getX(ti*3),uvAttr.getY(ti*3)]; ub_=[uvAttr.getX(ti*3+1),uvAttr.getY(ti*3+1)]; uc=[uvAttr.getX(ti*3+2),uvAttr.getY(ti*3+2)];
        }
        const uvx = ua[0]*w+ub_[0]*u+uc[0]*v, uvy = ua[1]*w+ub_[1]*u+uc[1]*v;
        const px = Math.max(0, Math.min(mapW-1, Math.floor(uvx*mapW)));
        const py = Math.max(0, Math.min(mapH-1, Math.floor((1-uvy)*mapH)));
        const d = mapCtx.getImageData(px,py,1,1).data;
        outCol.push(d[0]/255, d[1]/255, d[2]/255);
      } else if (mesh === sclera){
        // Аппроксимация радиального градиента белка
        const nx = local.x/(EYE_W/2), ny = local.y/(EYE_H/2 - 0.12);
        const d = Math.min(1, Math.hypot(nx, ny)*0.75);
        const c0 = new THREE.Color(COL.sclera0), c1 = new THREE.Color(COL.sclera1);
        const cc = c0.lerp(c1, d);
        outCol.push(cc.r, cc.g, cc.b);
      } else {
        outCol.push(baseCol.r, baseCol.g, baseCol.b);
      }
    }
  }

  eyeGroup.updateMatrixWorld(true);

  const positions = [], colors = [];
  // Плотность точек подобрана так, чтобы при сборе глаз "узнавался"
  sampleMesh(sclera,   8000, positions, colors);
  sampleMesh(iris,     7000, positions, colors);
  sampleMesh(pupil,    1800, positions, colors);
  sampleMesh(pupilRing, 600, positions, colors);
  sampleMesh(glint1,    400, positions, colors);
  sampleMesh(glint2,    150, positions, colors);

  const total = positions.length/3;
  const posArr = new Float32Array(positions);
  const colArr = new Float32Array(colors);
  const offsets = new Float32Array(total*3);
  const seeds = new Float32Array(total);

  // === КОМПАКТНЫЙ РАСПАД: маленький offset, небольшая площадь разлёта ===
  const SPREAD_R = 0.18;      // радиальный наружный сдвиг
  const JITTER   = 0.20;      // случайная составляющая
  for (let i=0;i<total;i++){
    const ix=i*3;
    const px=posArr[ix], py=posArr[ix+1];
    // направление наружу в плоскости миндаля (учитываем сплющенность по Y)
    const dx = px, dy = py * (EYE_W/EYE_H);
    const len = Math.hypot(dx,dy) || 1;
    offsets[ix]   = (dx/len)*SPREAD_R + (Math.random()-0.5)*JITTER;
    offsets[ix+1] = (dy/len)*SPREAD_R*(EYE_H/EYE_W) + (Math.random()-0.5)*JITTER*0.6;
    offsets[ix+2] = (Math.random()-0.5)*JITTER*0.3;
    seeds[i] = Math.random();
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
  geo.setAttribute('homePos',  new THREE.BufferAttribute(posArr.slice(), 3));
  geo.setAttribute('offset',   new THREE.BufferAttribute(offsets, 3));
  geo.setAttribute('color',    new THREE.BufferAttribute(colArr, 3));
  geo.setAttribute('seed',     new THREE.BufferAttribute(seeds, 1));

  const particleMat = new THREE.ShaderMaterial({
    uniforms: {
      uProgress: { value: 0 }, uTime: { value: 0 },
      uSize: { value: 2.8 * renderer.getPixelRatio() },
      uPixel: { value: 1.0 }
    },
    vertexShader: `
      attribute vec3 homePos; attribute vec3 offset; attribute float seed; attribute vec3 color;
      uniform float uProgress; uniform float uTime; uniform float uSize;
      varying vec3 vColor; varying float vAlpha;
      void main(){
        float a = seed * 0.55;
        float w = 0.45;
        float t = clamp((uProgress - a) / w, 0.0, 1.0);
        vec3 wobble = offset * 0.10 * sin(uTime*2.5 + seed*30.0);
        vec3 pos = mix(homePos, homePos + offset + wobble, t);
        vec4 mv = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * mv;
        // Орто-камера: размер от прогресса, без перспективы
        gl_PointSize = uSize * (1.0 + t*0.4);
        vColor = color;
        vAlpha = 1.0 - t*0.45;
      }`,
    fragmentShader: `
      precision mediump float; varying vec3 vColor; varying float vAlpha;
      void main(){
        vec2 uv = gl_PointCoord - 0.5;
        if (max(abs(uv.x), abs(uv.y)) > 0.5) discard;
        gl_FragColor = vec4(vColor, vAlpha);
      }`,
    transparent: true, depthWrite: false
  });

  const particles = new THREE.Points(geo, particleMat);
  eyeGroup.add(particles);

  // --- Слежение за курсором ---
  const mouse = new THREE.Vector2(0,0);
  addEventListener('pointermove', e => {
    mouse.x = (e.clientX/innerWidth)*2 - 1;
    mouse.y = -(e.clientY/innerHeight)*2 + 1;
  });

  // Для плоского глаза вместо поворота — двигаем iris+pupil (как на сайте)
  const irisGroup = new THREE.Group();
  // переносим радужку/зрачок/блики в группу для совместного смещения
  irisGroup.add(iris, pupil, pupilRing, glint1, glint2);
  eyeGroup.add(irisGroup);

  let progress = 0, direction = 0, auto = false;
  document.getElementById('btnDissolve').onclick = ()=> direction = +1;
  document.getElementById('btnAssemble').onclick = ()=> direction = -1;
  document.getElementById('btnToggle').onclick   = ()=> auto = !auto;
  renderer.domElement.addEventListener('click', ()=> direction = progress < 0.5 ? +1 : -1);

  addEventListener('resize', ()=>{
    camera = makeCam();
    renderer.setSize(innerWidth, innerHeight);
  });

  const clock = new THREE.Clock();
  function loop(){
    const dt = clock.getDelta();
    const t  = clock.elapsedTime;

    // Смещение радужки за курсором (в пределах ~30% от радиуса)
    const tx = mouse.x * 0.35, ty = mouse.y * 0.20;
    irisGroup.position.x += (tx - irisGroup.position.x) * Math.min(1, dt*8);
    irisGroup.position.y += (ty - irisGroup.position.y) * Math.min(1, dt*8);
    // Лёгкий 3D-поворот всей сцены
    const yaw = mouse.x * 0.12, pit = mouse.y * 0.08;
    eyeGroup.rotation.y += (yaw - eyeGroup.rotation.y) * Math.min(1, dt*6);
    eyeGroup.rotation.x += (-pit - eyeGroup.rotation.x) * Math.min(1, dt*6);

    if (auto){ if (progress>=1) direction=-1; if (progress<=0) direction=+1; }
    progress = Math.max(0, Math.min(1, progress + direction * dt * 0.7));

    const meshAlpha = 1 - Math.min(1, progress * 2);
    for (const m of eyeMeshes){
      if (!m.material.transparent) m.material.transparent = true;
      m.material.opacity = meshAlpha;
      m.visible = meshAlpha > 0.01;
    }
    rim.material.opacity = meshAlpha * 0.85;
    rim.visible = meshAlpha > 0.01;

    aura.material.uniforms.uTime.value = t;
    particleMat.uniforms.uProgress.value = progress;
    particleMat.uniforms.uTime.value = t;
    particles.visible = progress > 0.001;

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
